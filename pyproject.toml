[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-health-check"
version = "0.3.0"
description = "零依赖的开源项目健康度检查器：一条命令体检 README、LICENSE、社区文档与工程实践，输出可解释的评分卡。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pzh-frozen" }]
keywords = ["opensource", "health-check", "oss", "governance", "cli", "scorecard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
oshc = "oshc.cli:main"

[project.urls]
Homepage = "https://github.com/pzh-frozen/oss-health-check_35"
Issues = "https://github.com/pzh-frozen/oss-health-check_35/issues"
Changelog = "https://github.com/pzh-frozen/oss-health-check_35/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["oshc"]
