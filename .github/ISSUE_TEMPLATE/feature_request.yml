name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先描述场景与痛点，再谈方案，避免把方案当成问题
      placeholder: 每次给课程项目打分时，我都需要手动……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 可以描述命令行接口、输出格式或新的检查项
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 说明为什么不选它们，有助于评审时快速对齐
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 新增检查项
        - 评分模型
        - 输出与报告
        - CLI 与配置
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我已搜索过现有 issue 与路线图，确认这不是重复建议
          required: true
        - label: 该方案不引入第三方运行时依赖（否则请在正文说明理由）
          required: true
