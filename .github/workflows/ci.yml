name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装项目与开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 运行测试
        run: python -m pytest -q

      - name: 覆盖率统计
        if: matrix.python-version == '3.13'
        run: python -m pytest -q --cov=oshc --cov-report=term-missing

      - name: 用工具自检本仓库
        if: matrix.python-version == '3.13'
        run: python -m oshc scan . --fail-under 80
